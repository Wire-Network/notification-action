name: 'Send CI/CD Notification'
description: 'Send workflow status notifications to Slack or Mattermost'
author: 'Wire Network'

inputs:
  webhook-url:
    description: 'Webhook URL for Slack or Mattermost'
    required: true
  notification-type:
    description: 'Type of notification service: 1 for Mattermost, 2 for Slack'
    required: true
    default: '1'
  channel:
    description: 'Channel name (for Mattermost) or channel ID (for Slack)'
    required: false
    default: 'cicd-notifications'
  workflow-name:
    description: 'Name of the workflow (e.g., "Build & Test Workflow")'
    required: true
  job-results:
    description: >-
      Job results, as a JSON object {"job":"status"} or as `job:status` pairs
      separated by commas, spaces or newlines. Every entry must carry a
      non-empty status; input that parses to nothing is a hard error rather
      than a green notification.
    required: true
  github-context:
    description: 'GitHub context as JSON (use toJSON(github))'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Send Notification
      shell: bash
      # Inputs cross into the script through the environment, never through
      # `${{ }}` interpolation into the run body: workflow names, branch names
      # and PR titles routinely contain quotes and shell metacharacters.
      env:
        INPUT_WEBHOOK_URL: ${{ inputs.webhook-url }}
        INPUT_NOTIFICATION_TYPE: ${{ inputs.notification-type }}
        INPUT_CHANNEL: ${{ inputs.channel }}
        INPUT_WORKFLOW_NAME: ${{ inputs.workflow-name }}
        INPUT_JOB_RESULTS: ${{ inputs.job-results }}
        GITHUB_CONTEXT: ${{ inputs.github-context }}
      run: bash "${{ github.action_path }}/scripts/notify.sh"
